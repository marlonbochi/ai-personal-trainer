name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values: API routes read these at import time, so the build needs
      # them to exist. Real calls to Gemini are never made in CI.
      GEMINI_API_KEY: ci-dummy-key
      GEMINI_API_URL: https://example.invalid/gemini
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: `postinstall` runs a full build; the build step below does that once.
      - run: npm ci --ignore-scripts
      - name: Dependency audit (production, high)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Integration tests (production server)
        run: npm run test:integration
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (real browser, production build)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
